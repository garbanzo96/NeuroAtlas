  predicate: projects_to
  object: { type: entity, id: ent.human.v1 }
  contextId: ctx.schematic.human_visual_pathway
  measurement: pending_extraction
  modelId: null
  evidence:
    - sourceId: src.kandel_principles
      locator: pending
      locatorVerified: false
      relation: supports
      methodLimitations: Manual de referencia; evidencia primaria pendiente de identificar.
  uncertainty:
    measurement: no_aplica
    samplingGeneralization: No describe otras dianas corticales del NGL ni vías visuales alternativas.
    competingExplanations: No aplica.
  status: draft
  provenance:
    author: NeuroAtlas (sesión de arquitectura)
    extractor: llm:claude
    createdOn: 2026-10-04
    method: Redacción a partir de conocimiento de manual; fuente asignada como candidata sin consultar el texto.
  display: { label: observation }
- id: claim.visual.v1_calcarine
  version: 1
  proposition:
    es: >-
      En humanos, V1 se sitúa principalmente en las paredes del surco calcarino, en la cara medial
      del lóbulo occipital.
  kind: observation
  subjectIds: [ent.human.v1]
  predicate: located_in
  object: { type: text, text: 'paredes del surco calcarino, lóbulo occipital medial' }
  contextId: ctx.schematic.human_visual_pathway
  measurement: pending_extraction
  modelId: null
  evidence:
    - sourceId: src.kandel_principles
      locator: pending
      locatorVerified: false
      relation: supports
      methodLimitations: Manual de referencia. La extensión exacta varía entre individuos; un atlas probabilístico (WP-020) aportará la variabilidad.
  uncertainty:
    measurement: no_aplica
    samplingGeneralization: Localización típica; la extensión y los bordes varían entre individuos y hemisferios.
    competingExplanations: No aplica.
  status: draft
  provenance:
    author: NeuroAtlas (sesión de arquitectura)
    extractor: llm:claude
