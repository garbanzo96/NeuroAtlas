# yaml-language-server: $schema=../../packages/schemas/json/claim.file.schema.json
# Puentes didácticos: afirmaciones sobre la REPRESENTACIÓN, no sobre biología. La interfaz los
# muestra antes y después de cada transición entre escenas de contextos distintos.
- id: claim.bridge.pathway_to_v1_location
  version: 1
  proposition:
    es: >-
      Pasas de un diagrama esquemático a una escena que localizará V1 sobre la anatomía de un atlas
      humano. El diagrama no está registrado en coordenadas del atlas: la correspondencia es
      conceptual (misma estructura nombrada), no espacial.
  kind: didactic_bridge
  subjectIds: [scene.visual.pathway, scene.visual.v1_location]
  predicate: conceptual_bridge_to
  object: { type: entity, id: scene.visual.v1_location }
  contextId: ctx.schematic.human_visual_pathway
  measurement: not_applicable
  modelId: null
  evidence: []
  uncertainty:
    measurement: no_aplica
    samplingGeneralization: no_aplica
    competingExplanations: no_aplica
  status: draft
  provenance:
    author: NeuroAtlas (sesión de arquitectura)
    extractor: llm:claude
    createdOn: 2026-10-04
    method: Texto didáctico exigido por el contrato de transiciones.
  display: { label: educational_schematic }
- id: claim.bridge.pathway_to_laminar
  version: 1
  proposition:
    es: >-
      Pasas de la vía visual humana a un esquema laminar genérico de neocorteza. La especie del
      circuito está pendiente de decisión y el esquema no describe un área ni un individuo concretos:
      no es un acercamiento continuo a la V1 del diagrama anterior.
  kind: didactic_bridge
  subjectIds: [scene.visual.pathway, scene.visual.v1_laminar_circuit]
  predicate: conceptual_bridge_to
  object: { type: entity, id: scene.visual.v1_laminar_circuit }
