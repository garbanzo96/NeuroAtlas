- id: claim.bridge.cell_to_excitability
  version: 1
  proposition:
    es: >-
      Cambias de especie y de tipo de representación: la escena siguiente ejecuta el modelo
      matemático de Hodgkin y Huxley, formulado para el axón gigante de calamar. Ilustra cómo
      corrientes dependientes del voltaje generan un potencial de acción; no está parametrizado
      para la neurona piramidal anterior.
  kind: didactic_bridge
  subjectIds: [scene.visual.cell_morphology, scene.visual.excitability]
  predicate: conceptual_bridge_to
