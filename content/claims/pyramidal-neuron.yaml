      locator: pending
      locatorVerified: false
      relation: supports
      methodLimitations: Revisión.
    - sourceId: src.biccn_bican
      locator: pending
      locatorVerified: false
      relation: contextualizes
      methodLimitations: Taxonomías multimodales; elegir release y especie antes de citar clases concretas.
  uncertainty:
