- id: claim.cortex.canonical_not_universal
  version: 1
  proposition:
    es: >-
      El "circuito canónico" es una generalización: la conectividad laminar varía entre áreas y
      especies (por ejemplo, en cortezas agranulares sin una capa 4 definida) y existen vías que no
      siguen la secuencia 4 → 2/3 → 5 → 6.
  kind: inference
  subjectIds: [ent.neocortex.layer_4, ent.neocortex.l4_excitatory]
  predicate: has_limitation
  object: { type: text, text: variación entre áreas y especies }
  contextId: ctx.schematic.neocortex_laminar_generic
  measurement: not_applicable
  modelId: null
  evidence:
    - sourceId: src.harris_shepherd_2015
      locator: pending
      locatorVerified: false
      relation: supports
      methodLimitations: Revisión.
  uncertainty:
    measurement: no_aplica
    samplingGeneralization: Pendiente enumerar las variaciones concretas con sus fuentes primarias.
    competingExplanations: No aplica.
  status: draft
  provenance:
    author: NeuroAtlas (sesión de arquitectura)
    extractor: llm:claude
    createdOn: 2026-10-04
    method: Redacción a partir de conocimiento de revisiones; fuente asignada como candidata sin consultar el texto.
  display: { label: inference }
