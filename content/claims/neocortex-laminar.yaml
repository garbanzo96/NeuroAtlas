# yaml-language-server: $schema=../../packages/schemas/json/claim.file.schema.json
# BORRADORES del esquema laminar genérico. Se etiquetan como "esquema educativo": describen una
# generalización ("circuito canónico"), no una medición en una especie y área concretas.
- id: claim.cortex.thalamic_input_l4
  version: 1
  proposition:
    es: >-
      En el esquema clásico del circuito de una corteza sensorial primaria, las aferencias de los
      núcleos talámicos de relevo de primer orden terminan sobre todo en la capa 4.
  kind: inference
  subjectIds: [ent.generic.thalamus_first_order]
  predicate: projects_to
  object: { type: entity, id: ent.neocortex.l4_excitatory }
  contextId: ctx.schematic.neocortex_laminar_generic
  measurement: pending_extraction
  modelId: null
  evidence:
    - sourceId: src.douglas_martin_2004
      locator: pending
      locatorVerified: false
      relation: supports
      methodLimitations: Revisión; especie, área y método de los estudios originales pendientes de extracción.
    - sourceId: src.harris_shepherd_2015
      locator: pending
      locatorVerified: false
      relation: contextualizes
      methodLimitations: Revisión de variaciones entre áreas y especies.
  uncertainty:
    measurement: no_aplica
    samplingGeneralization: Las aferencias talámicas también alcanzan otras capas; la proporción depende de especie y área.
    competingExplanations: No aplica.
  status: draft
  provenance:
    author: NeuroAtlas (sesión de arquitectura)
    extractor: llm:claude
    createdOn: 2026-10-04
    method: Redacción a partir de conocimiento de revisiones; fuentes asignadas como candidatas sin consultar el texto.
  display: { label: educational_schematic }
