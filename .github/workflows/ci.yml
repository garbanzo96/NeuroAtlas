name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Comprobaciones (formato, lint, tipos, fronteras, contenido, pruebas, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm run check
        run: npm run check
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end
        run: npx playwright test
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
